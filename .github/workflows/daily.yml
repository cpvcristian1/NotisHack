name: Daily Hackathon Check

on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC daily (10:00/11:00 hora España)
  workflow_dispatch: # trigger manual desde la pestaña Actions

permissions:
  contents: write # necesario para commit del estado notified.json

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run hackathon check
        run: python main.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BRABBLE_API_KEY: ${{ secrets.BRABBLE_API_KEY }}

      - name: Save notified state
        run: |
          if [ -f notified.json ]; then
            git config user.name "hackathon-bot"
            git config user.email "hackathon-bot@users.noreply.github.com"
            git add notified.json
            git diff --staged --quiet || git commit -m "chore: update notified state [skip ci]"
            git push
          fi
